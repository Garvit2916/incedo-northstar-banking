server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Rendered by the official nginx image at container start. Local Compose
    # overrides API_UPSTREAM with api:8080; ECS leaves it as the loopback sidecar.
    # X-Forwarded-For/Proto from the ALB are passed through untouched so the API
    # can recover the real client IP and original scheme from its loopback proxy.
    location /api/ {
        proxy_pass http://${API_UPSTREAM};
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $http_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }

    location /health/ {
        proxy_pass http://${API_UPSTREAM};
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $http_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }

    # Single-page-app fallback.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
