name: CI

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  backend:
    name: Backend build & tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore Northstar.slnx

      - name: Build
        run: dotnet build Northstar.slnx --no-restore -c Release

      - name: Test
        run: dotnet test Northstar.slnx --no-build -c Release --verbosity normal

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        run: npm ci

      - name: Build (type-check + bundle)
        run: npm run build

      - name: Test (Vitest)
        run: npm run test

  smoke:
    name: Live API smoke suite
    runs-on: ubuntu-latest
    needs: backend
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Start API
        env:
          ASPNETCORE_ENVIRONMENT: Development
          ASPNETCORE_URLS: http://localhost:5199
        run: |
          nohup dotnet run --project backend/src/Northstar.Api --no-launch-profile > api.log 2>&1 &

      - name: Wait for health
        run: |
          for i in $(seq 1 90); do
            if curl -fsS http://localhost:5199/health/live >/dev/null 2>&1; then
              echo "API is up."
              exit 0
            fi
            sleep 2
          done
          echo "API failed to become healthy."
          cat api.log
          exit 1

      - name: Run smoke suite
        shell: pwsh
        run: ./scripts/smoke.ps1
